<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLO_VORTEX — Communauté Gaming</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    font-family:Arial,Helvetica,sans-serif; color:#fff;
    background:
      radial-gradient(circle at 50% 0%, #6d32ff55, transparent 38%),
      linear-gradient(160deg,#08030f,#16052b 55%,#07030d);
  }
  .page{width:min(460px,100%); padding:38px 22px 45px; text-align:center}
  .logo{
    width:108px;height:108px;margin:0 auto 16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(135deg,#6d3cff,#d832ff 55%,#20bfff);
    box-shadow:0 0 35px #8d35ff88, inset 0 0 20px #ffffff33;
    border:3px solid #ffffff33;
  }
  h1{margin:0;font-size:28px}
  .tag{margin:8px 0 7px;color:#cdb9ff;font-weight:700}
  .desc{margin:0 auto 25px;color:#e9e2f5;line-height:1.45;font-size:15px}
  .btn{
    display:block;text-decoration:none;color:#fff;font-weight:800;
    padding:17px 18px;margin:13px 0;border-radius:16px;
    background:linear-gradient(100deg,#743cff,#b52dff);
    box-shadow:0 8px 25px #0006;border:1px solid #ffffff22;
    transition:.15s transform;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.twitch{background:linear-gradient(100deg,#6d35d8,#9b48ff)}
  .btn.secondary{background:#ffffff12;border:1px solid #ffffff25}
  .small{margin-top:25px;color:#aaa0b8;font-size:12px}
</style>
</head>
<body>
<main class="page">
  <div class="logo">VORTEX</div>
  <h1>FLO_VORTEX 🎮💜</h1>
  <div class="tag">Communauté gaming chill</div>
  <p class="desc">Warzone • Fortnite • Sessions entre joueurs<br>Viens jouer avec nous !</p>

  <a class="btn" href="https://discord.gg/qSgJ5DmRK" target="_blank" rel="noopener">
    💜 REJOINDRE LE SERVEUR DISCORD
  </a>
  <a class="btn twitch" href="https://www.twitch.tv/florestine_vortex" target="_blank" rel="noopener">
    🎥 SUIVRE SUR TWITCH
  </a>
  <a class="btn secondary" href="https://www.tiktok.com/@floflo_vortex" target="_blank" rel="noopener">
    🎵 RETOUR SUR TIKTOK
  </a>

  <div class="small">FLO_VORTEX • Warzone & Fortnite</div>
</main>
</body>
</html>
